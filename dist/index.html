    <title>The Forge</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #15171a; }
      #forge-startup {
        --forge-cycle: 1.5s;
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        overflow: hidden; background: radial-gradient(circle at 50% 44%, #20242a 0, #15181c 34%, #0d0f11 76%);
        color: #f4f1ea; opacity: 1; transition: opacity 380ms ease, visibility 380ms ease;
      }
      #forge-startup.forge-startup--leaving { opacity: 0; visibility: hidden; }
      .forge-startup__content { display: grid; justify-items: center; gap: 15px; transform: translateY(-3vh); }
      .forge-startup__mark { position: relative; width: 164px; height: 164px; }
      .forge-startup__icon { position: relative; z-index: 1; display: block; width: 100%; height: 100%; border-radius: 32px; }
      .forge-startup__plate { position: absolute; z-index: 2; top: 31.5%; width: 11.5%; height: 36%; border-radius: 42%; pointer-events: none;
        background: rgba(255, 167, 35, .08); animation: forge-plates var(--forge-cycle) linear infinite; }
      .forge-startup__plate--left { left: 23.5%; }
      .forge-startup__plate--right { right: 23.5%; }
      .forge-startup__name {
        font-family: "Eurostile Extended", Microgramma, "Arial Black", "Helvetica Neue", sans-serif;
        font-size: 25px; line-height: 1; font-weight: 900;
        letter-spacing: .075em; text-transform: uppercase; color: #111417; transform: scaleX(1.08);
        background: linear-gradient(105deg, transparent 0%, transparent 39%, #050607 40%, #555c62 42%, #c6cacf 45%, #e49329 46%, #ffb548 50%, #e18a22 54%, #c1c5c8 55%, #777e84 58%, #050607 60%, transparent 61%, transparent 100%);
        background-size: 280% 100%; background-position: 100% 0;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 0 transparent;
        text-shadow: none;
        animation: forge-wordmark var(--forge-cycle) linear infinite;
      }
      .forge-startup__embers { display: flex; gap: 7px; height: 5px; align-items: center; }
      .forge-startup__embers i { width: 4px; height: 4px; border-radius: 50%; background: #e9a642; box-shadow: 0 0 9px #e9a642; opacity: .15; }
      .forge-startup__embers i:nth-child(1) { animation: forge-dot-one var(--forge-cycle) linear infinite; }
      .forge-startup__embers i:nth-child(2) { animation: forge-dot-two var(--forge-cycle) linear infinite; }
      .forge-startup__embers i:nth-child(3) { animation: forge-dot-three var(--forge-cycle) linear infinite; }
      @keyframes forge-plates { 0%, 10%, 88%, 100% { opacity: .12; box-shadow: 0 0 2px rgba(233,166,66,.12); } 43%, 57% { opacity: 1; box-shadow: 0 0 18px 6px rgba(255,137,20,.7), inset 0 0 10px rgba(255,204,101,.48); } }
      @keyframes forge-wordmark { 0%, 8% { background-position: 100% 0; } 84%, 100% { background-position: 0 0; } }
      @keyframes forge-dot-one { 0%, 9%, 34%, 100% { opacity: .15; transform: scale(.65); } 19%, 26% { opacity: 1; transform: scale(1); } }
      @keyframes forge-dot-two { 0%, 31%, 56%, 100% { opacity: .15; transform: scale(.65); } 41%, 48% { opacity: 1; transform: scale(1); } }
      @keyframes forge-dot-three { 0%, 53%, 78%, 100% { opacity: .15; transform: scale(.65); } 63%, 70% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .forge-startup__mark, .forge-startup__plate, .forge-startup__name, .forge-startup__embers i { animation: none; } }
    </style>
